# Render Blueprint (FREE plan) - https://render.com/docs/blueprint-spec
# New > Blueprint > select this repository. Models are trained during the Docker build.
# Note: free instances have no persistent disk, so the SQLite database resets on redeploy/restart
# (fine for demos and project evaluation). For persistent data use a free external PostgreSQL
# (e.g. Neon / Supabase free tier) via HC_DATABASE_URL.
services:
  - type: web
    name: healthcare-detection-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HC_ENV
        value: production
      - key: HC_JWT_SECRET
        generateValue: true
      - key: HC_ENCRYPTION_KEY   # set once to a Fernet key and never change it (see docs/DEPLOYMENT.md)
        sync: false
      - key: HC_LLM_PROVIDER
        value: auto              # free offline assistant unless ANTHROPIC_API_KEY is set
